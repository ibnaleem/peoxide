[package]
name = "peoxide-py"
description = "A fast PE file parser library for Python, written in Rust."
version.workspace = true
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "peoxide"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
peoxide-core = { path = "../peoxide-core" }